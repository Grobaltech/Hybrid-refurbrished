name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'capacitor.config.ts'
      - 'scripts/generate-android-icons.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm run build
      - name: Generate Android icon assets
        run: node scripts/generate-android-icons.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Generate native launcher and splash assets
        run: npx @capacitor/assets generate --android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-shop-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
